<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Rạp Chiếu Phim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f8f9fc;
        }
        .sidebar {
            width: 240px;
            background-color: #2d3e50;
            height: 100vh;
            position: fixed;
            color: white;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }
        .sidebar a:hover {
            background-color: #1c2938;
        }

    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="text-center mb-4">RECINEMA</h4>
        <a href="#"><i class="fas fa-tachometer-alt"></i> Tổng quan</a>
        <a href="#"><i class="fas fa-chart-bar"></i> Thống kê</a>
        <a href="#"><i class="fas fa-film"></i> Phim & Xuất chiếu</a>
        <a href="#"><i class="fas fa-ticket-alt"></i> Vé đặt</a>
        <a href="#"><i class="fas fa-users"></i> Khách hàng</a>
        <a href="#"><i class="fas fa-cog"></i> Cài đặt</a>
    </div>

    <div class="content">

    </div>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Biểu đồ doanh thu
        const revenueCtx = document.getElementById('revenueChart').getContext('2d');
        const revenueChart = new Chart(revenueCtx, {
            type: 'line',
            data: {
                labels: ['23/06', '24/06', '25/06', '26/06', '27/06', '28/06', '29/06'],
                datasets: [{
                    label: 'Doanh thu (VND)',
                    data: [2500000, 3100000, 2800000, 2200000, 1800000, 2900000, 4000000],
                    fill: true,
                    borderColor: '#4e73df',
                    backgroundColor: 'rgba(78, 115, 223, 0.05)',
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return (value / 1000000).toFixed(1) + 'tr';
                            }
                        }
                    }
                }
            }
        });

        // Biểu đồ thể loại
        const genreCtx = document.getElementById('genreChart').getContext('2d');
        const genreChart = new Chart(genreCtx, {
            type: 'doughnut',
            data: {
                labels: ['Hành động', 'Hài', 'Kinh dị', 'Tâm lý', 'Sci-fi'],
                datasets: [{
                    data: [35, 25, 15, 15, 10],
                    backgroundColor: [
                        '#4e73df',
                        '#1cc88a',
                        '#e74a3b',
                        '#f6c23e',
                        '#36b9cc'
                    ],
                    hoverBackgroundColor: [
                        '#2e59d9',
                        '#17a673',
                        '#be2617',
                        '#dda20a',
                        '#2c9faf'
                    ],
                    hoverBorderColor: "rgba(234, 236, 244, 1)",
                }],
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                    }
                },
                cutout: '70%',
            }
        });

        // Biểu đồ lịch chiếu
        const scheduleCtx = document.getElementById('scheduleChart').getContext('2d');
        const scheduleChart = new Chart(scheduleCtx, {
            type: 'bar',
            data: {
                labels: ['8h', '10h', '12h', '14h', '16h', '18h', '20h', '22h'],
                datasets: [{
                    label: 'Số suất chiếu',
                    data: [3, 5, 2, 6, 4, 8, 7, 3],
                    backgroundColor: 'rgba(78, 115, 223, 0.8)',
                    borderColor: 'rgba(78, 115, 223, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        });

        // Xử lý tab thể loại phim
        document.querySelectorAll('.genre-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Xóa active tất cả các nút
                document.querySelectorAll('.genre-btn').forEach(b => {
                    b.classList.remove('active');
                    b.classList.remove('btn-primary');
                    b.classList.add('btn-outline-primary');
                });
                
                // Thêm active cho nút được click
                this.classList.add('active');
                this.classList.add('btn-primary');
                this.classList.remove('btn-outline-primary');
                
                // Ẩn tất cả nội dung
                document.querySelectorAll('.genre-content').forEach(content => {
                    content.classList.remove('active');
                });
                
                // Hiển thị nội dung tương ứng
                const genre = this.getAttribute('data-genre');
                document.getElementById(genre).classList.add('active');
            });
        });
    </script>
</body>
</html>
